<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Starry Pixel Night</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            background-color: #0d021a;
        }

        /* Fullscreen Background Image */
        .bg-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            /* Make sure 'bg.png' matches your uploaded file name */
            background: url('bg.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* Animated Shooting Stars Overlay */
        .sky-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
            pointer-events: none;
        }

        .shooting-star {
            position: absolute;
            width: 120px;
            height: 2px;
            background: linear-gradient(90deg, #ffffff, rgba(255, 182, 255, 0));
            border-radius: 50%;
            filter: drop-shadow(0 0 8px #e08aff);
            opacity: 0;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translate(0, 0) rotate(-35deg);
                opacity: 1;
            }
            70% {
                opacity: 1;
            }
            100% {
                transform: translate(-900px, 900px) rotate(-35deg);
                opacity: 0;
            }
        }

        /* Content Card Overlay */
        .content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            height: 100%;
            color: #fbcfe8;
            text-align: center;
            padding: 20px;
        }

        .card {
            background: rgba(25, 10, 40, 0.75);
            backdrop-filter: blur(4px);
            border: 2px solid #c084fc;
            box-shadow: 0 0 15px rgba(192, 132, 252, 0.4);
            border-radius: 16px;
            padding: 30px;
            max-width: 450px;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 12px;
            text-shadow: 2px 2px #581c87;
        }

        p {
            font-size: 1rem;
            line-height: 1.5;
            color: #f472b6;
        }
    </style>
</head>
<body>

    <!-- Background Image Container -->
    <div class="bg-container"></div>

    <!-- Shooting Stars Field -->
    <div class="sky-overlay" id="star-field"></div>

    <!-- Website Text / Content -->
    <div class="content">
        <div class="card">
            <h1>Under the Stars</h1>
            <p>Welcome to our pixel paradise!</p>
        </div>
    </div>

    <script>
        function spawnStar() {
            const starField = document.getElementById('star-field');
            const star = document.createElement('div');
            star.classList.add('shooting-star');

            const startX = Math.random() * (window.innerWidth + 300);
            const startY = Math.random() * (window.innerHeight / 2) - 100;

            star.style.left = `${startX}px`;
            star.style.top = `${startY}px`;

            const duration = Math.random() * 2 + 1.5;
            const delay = Math.random() * 3;

            star.style.animationDuration = `${duration}s`;
            star.style.animationDelay = `${delay}s`;

            starField.appendChild(star);

            setTimeout(() => {
                star.remove();
            }, (duration + delay) * 1000);
        }

        setInterval(spawnStar, 900);
    </script>

</body>
</html>
